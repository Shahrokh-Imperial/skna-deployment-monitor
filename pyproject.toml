[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="skna-deployment-monitor"
version="1.0.0"
description="Raw-to-results ECG-derived SKNA deployment and replay monitor"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
dependencies=["streamlit==1.61.0","starlette==0.52.1","plotly>=5.20","pandas>=2.0","numpy>=1.24","scipy>=1.10","scikit-learn>=1.3","pyarrow>=14"]

[tool.setuptools.packages.find]
where=["src"]
